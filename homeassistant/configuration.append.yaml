
# ── Peeters dashboard: voice control ──────────────────────────────────
# Exposes chosen scripts to Alexa as Hue "lights" ("Alexa, turn on Bedtime").
# Echos only discover a Hue bridge on port 80, which the dashboard's Caddy
# owns, so HA listens on 8300 and advertises port 80; Caddy forwards the Hue
# paths (/description.xml, /api, /api/nouser/*) here. See web/Caddyfile.
emulated_hue:
  listen_port: 8300
  advertise_ip: 192.168.10.6  # apply.sh fills this in from DASHBOARD_HOST in .env
  advertise_port: 80
  expose_by_default: false
  entities:
    script.bedtime:
      name: Bedtime
      hidden: false
    script.tidy_up_countdown:
      name: Tidy up countdown
      hidden: false
    script.get_dressed_countdown:
      name: Get dressed countdown
      hidden: false
    script.teeth_countdown:
      name: Teeth countdown
      hidden: false
    script.maths_countdown:
      name: Maths countdown
      hidden: false
    script.quiet_time_countdown:
      name: Quiet time countdown
      hidden: false
    script.stop_countdown:
      name: Stop countdown
      hidden: false

# The dashboard API does the work (dim screens, goodnight, music).
rest_command:
  peeters_bedtime:
    url: http://127.0.0.1/api/bedtime
    method: POST
    content_type: application/json
    payload: '{"source":"alexa"}'
  # Kids board countdowns; chore is one of tidy, dressed, teeth, maths,
  # quiet, stop (see scripts.yaml).
  peeters_timer:
    url: http://127.0.0.1/api/timer
    method: POST
    content_type: application/json
    payload: '{"chore":"{{ chore }}"}'
# ── end Peeters dashboard ──
