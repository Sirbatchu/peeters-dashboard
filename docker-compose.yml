services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: peeters
      POSTGRES_USER: peeters
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Europe/London}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U peeters -d peeters']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://peeters:${POSTGRES_PASSWORD}@db:5432/peeters
      TZ: ${TZ:-Europe/London}
      WEATHER_LOC: ${WEATHER_LOC:-Bristol}
      PUBLIC_URL: ${PUBLIC_URL:-http://192.168.10.6}
      # Invites are only sent when these are set. Leave blank to disable.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      INVITE_FROM: ${INVITE_FROM:-}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - api

volumes:
  db_data:
