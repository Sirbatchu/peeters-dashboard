services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: peeters
      POSTGRES_USER: peeters
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Europe/London}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U peeters -d peeters']
      interval: 10s
      timeout: 5s
      retries: 10

  # Device integration layer. Host networking is REQUIRED — Sonos, Hue and
  # Chromecast discovery all rely on SSDP/mDNS broadcast traffic, which does
  # not cross a Docker bridge network. Binds :8123 directly on the host.
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: ${TZ:-Europe/London}
    volumes:
      - ha_config:/config
      - /run/dbus:/run/dbus:ro

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://peeters:${POSTGRES_PASSWORD}@db:5432/peeters
      TZ: ${TZ:-Europe/London}
      WEATHER_LOC: ${WEATHER_LOC:-Bristol}
      PUBLIC_URL: ${PUBLIC_URL:-http://${DASHBOARD_HOST:-192.168.10.6}}
      # Home Assistant is on host networking, so reach it via the gateway.
      HA_URL: ${HA_URL:-http://host.docker.internal:8123}
      HA_TOKEN: ${HA_TOKEN:-}
      # Invites are only sent when these are set. Leave blank to disable.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      INVITE_FROM: ${INVITE_FROM:-}
      # Parent PIN for claiming prizes. Unset = claiming is locked.
      PARENT_PIN: ${PARENT_PIN:-}
      # J.A.R.V.I.S. ("Alexa, ask Jarvis ..."). Blank key disables him.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ALEXA_SKILL_ID: ${ALEXA_SKILL_ID:-}
      JARVIS_MODEL: ${JARVIS_MODEL:-}
      JARVIS_EFFORT: ${JARVIS_EFFORT:-}
      JARVIS_VOICE: ${JARVIS_VOICE-Brian}
    volumes:
      - ./photos:/photos:ro
      # Background photos uploaded from phones via http://<host>/photos
      - backgrounds:/backgrounds
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    restart: unless-stopped
    environment:
      # The Mini's LAN address: Caddy's HTTPS certificate and the Alexa Hue
      # proxy use it (see web/Caddyfile).
      DASHBOARD_HOST: ${DASHBOARD_HOST:-192.168.10.6}
    ports:
      - '80:80'
      # HTTPS for the Android tablet's app install (local CA, see Caddyfile).
      # Host port 8443 because another container on the Mini already owns 443.
      - '8443:443'
    volumes:
      - caddy_data:/data
    depends_on:
      - api

  # Public door for the Alexa skill: a Cloudflare Tunnel to the api's :3001,
  # which serves ONLY the signed-request skill endpoint. Nothing else on the
  # Mini is exposed and no router ports are opened. Off unless .env has
  # COMPOSE_PROFILES=jarvis and CLOUDFLARE_TUNNEL_TOKEN set.
  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    profiles: ['jarvis']
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - api

volumes:
  db_data:
  ha_config:
  caddy_data:
  backgrounds:
