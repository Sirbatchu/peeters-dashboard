services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: peeters
      POSTGRES_USER: peeters
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Europe/London}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U peeters -d peeters']
      interval: 10s
      timeout: 5s
      retries: 10

  # Device integration layer. Host networking is REQUIRED — Sonos, Hue and
  # Chromecast discovery all rely on SSDP/mDNS broadcast traffic, which does
  # not cross a Docker bridge network. Binds :8123 directly on the host.
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: ${TZ:-Europe/London}
    volumes:
      - ha_config:/config
      - /run/dbus:/run/dbus:ro

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://peeters:${POSTGRES_PASSWORD}@db:5432/peeters
      TZ: ${TZ:-Europe/London}
      WEATHER_LOC: ${WEATHER_LOC:-Bristol}
      PUBLIC_URL: ${PUBLIC_URL:-http://192.168.10.6}
      # Home Assistant is on host networking, so reach it via the gateway.
      HA_URL: ${HA_URL:-http://host.docker.internal:8123}
      HA_TOKEN: ${HA_TOKEN:-}
      # Invites are only sent when these are set. Leave blank to disable.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      INVITE_FROM: ${INVITE_FROM:-}
      PARENT_PIN: ${PARENT_PIN:-1234}
    volumes:
      - ./photos:/photos:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - api

volumes:
  db_data:
  ha_config:
