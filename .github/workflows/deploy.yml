name: Deploy to Mac Mini

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # ~/peeters-dashboard keeps the untracked bits (.env, photos/).
      # Everything tracked in git is replaced wholesale from the checkout.
      - name: Sync source
        run: |
          DEST="$HOME/peeters-dashboard"
          mkdir -p "$DEST"
          tar -cf - --exclude=.git . | tar -xf - -C "$DEST"

      - name: Build and restart stack
        working-directory: /home/nhadmin/peeters-dashboard
        run: docker compose -p peeters up -d --build

      - name: Smoke test
        run: |
          sleep 6
          curl -sf http://localhost/api/health
          curl -sf -o /dev/null http://localhost/
          echo "deploy OK"
